<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      margin: 0;
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .setting-group { margin-bottom: 16px; }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 13px;
      color: #555;
    }

    input[type="number"] {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #81b64c;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #81b64c;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover { background-color: #6fa33d; }
    button:active { background-color: #5e8c34; }

    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .status.show { display: block; }
    .status.success { background-color: #e8f5e9; color: #2e7d32; }
    .status.error { background-color: #ffebee; color: #b71c1c; }
  </style>
</head>
<body>
  <h2>Chess.com Auto-Next</h2>

  <div class="setting-group">
    <div class="input-group">
      <label for="delayInput">Delay (milliseconds) - Default: 5ms</label>
      <input type="number" id="delayInput" min="0" max="10000" step="1" value="5" placeholder="5">
    </div>
  </div>

  <button id="saveBtn">Save Settings</button>
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
